name: MCP Pipeline with Dynamic AWS Profile in Docker

on:
  push:
    branches:
      - main

jobs:
  run-q-chat:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t amazonq-pipeline .

    - name: Run container and execute q chat with dynamic AWS profile
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }} # optional
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        docker run --rm -i \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          -e AWS_REGION \
          -e AWS_PROFILE=myprofile \
          amazonq-pipeline bash -c "\
            mkdir -p ~/.aws && \
            echo '[myprofile]' > ~/.aws/credentials && \
            echo 'aws_access_key_id=${AWS_ACCESS_KEY_ID}' >> ~/.aws/credentials && \
            echo 'aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}' >> ~/.aws/credentials && \
            if [ ! -z \"${AWS_SESSION_TOKEN}\" ]; then echo 'aws_session_token=${AWS_SESSION_TOKEN}' >> ~/.aws/credentials; fi && \
            echo '[profile myprofile]' > ~/.aws/config && \
            echo 'region=${AWS_REGION}' >> ~/.aws/config && \
            /usr/local/bin/q chat"
